{% extends 'base/main.html' %}

{% block content %}
<style>
    .admin-wrapper {
        min-height: calc(100vh - 60px);
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        padding: min(1px, 4vw);
        font-family: 'Inter', sans-serif;
    }
    
    .admin-nav {
        background: rgba(26, 32, 44, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: min(15px, 3vw);
        margin-bottom: min(20px, 4vw);
        box-shadow: 0 4px 16px rgba(31, 38, 135, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .nav-links {
        display: flex;
        gap: min(20px, 3vw);
        flex-wrap: wrap;
        justify-content: center;
    }
    
    .nav-links a {
        color: #e8f6ff;
        text-decoration: none;
        padding: min(12px, 2.5vw) min(16px, 3vw);
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.3s ease;
        font-family: 'Poppins', sans-serif;
        font-size: min(16px, 4vw);
        font-weight: 500;
        flex: 1;
        justify-content: center;
        min-width: 140px;
        text-align: center;
    }
    
    .nav-links a i {
        font-size: min(18px, 4.5vw);
        color: #90caf9;
    }
    
    .nav-links a:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #64b5f6;
        transform: translateY(-1px);
    }
    
    .nav-links a.active {
        background: rgba(100, 181, 246, 0.2);
        color: #64b5f6;
        border: 1px solid rgba(100, 181, 246, 0.3);
    }
    
    .admin-content {
        background: rgba(26, 32, 44, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: min(20px, 4vw);
        min-height: 500px;
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1, h2, h3, h4, h5, h6 {
        font-family: 'Montserrat', sans-serif;
        color: #e8f6ff;
    }

    p {
        font-family: 'Inter', sans-serif;
        font-size: min(16px, 4vw);
        line-height: 1.6;
    }
</style>

<div class="admin-wrapper">
    <nav class="admin-nav">
        <div class="nav-links">
            
            <a href="{% url 'admin_users' %}" class="{% if request.resolver_match.url_name == 'admin_users' %}active{% endif %}">
                <i class="bi bi-people"></i> Users
            </a>
            <a href="{% url 'admin_token_history' %}" class="{% if request.resolver_match.url_name == 'admin_token_history' %}active{% endif %}">
                <i class="bi bi-clock-history"></i> History
            </a>
            <a href="{% url 'admin_analytics' %}" class="{% if request.resolver_match.url_name == 'admin_analytics' %}active{% endif %}">
                <i class="bi bi-graph-up"></i> Analytics
            </a>
            <a href="{% url 'admin_sensor_assignment' %}" class="{% if request.resolver_match.url_name == 'admin_sensor_assignment' %}active{% endif %}">
                <i class="bi bi-link"></i> Sensors
            </a>
            
        </div>
    </nav>

    <div class="admin-content">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
